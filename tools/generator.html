<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB MICE 퍼즐 생성기</title>
<style>
  body { font-family: "Noto Sans KR", Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px 16px; background: #f8fafc; color: #0f172a; }
  h1 { margin: 0 0 8px; }
  p { color: #475569; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  input, button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; }
  button { background: #2563eb; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  #log { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 10px; min-height: 120px; white-space: pre-wrap; font: 13px/1.5 monospace; }
</style>
</head>
<body>
<h1>🐭 LAB MICE 퍼즐 생성기</h1>
<p>버튼을 누르면 난이도 3가지(입문·기본·도전) × 레벨 0~5 × 5문제 = 90문제를 새로 만들어요. 모든 문제는 자동 풀이기로 <b>해답이 정확히 1개</b>인지 확인한 것만 남깁니다.
   끝나면 <code>puzzles.js</code> 파일이 내려받아지니, 저장소의 <code>js/puzzles.js</code>를 그 파일로 바꾸면 돼요.<br>
   (seed 숫자가 같으면 항상 같은 문제가 나와요. 몇 분 걸릴 수 있어요.)</p>
<div class="row">
  <label>seed <input id="seed" type="number" value="2026" style="width:120px"></label>
  <button id="go">문제 만들기</button>
</div>
<div id="log">대기 중</div>

<script src="../js/labmice-core.js"></script>
<script src="generator.js"></script>
<script>
  const log = document.getElementById('log');
  const go = document.getElementById('go');
  go.onclick = async () => {
    go.disabled = true;
    const seed = Number(document.getElementById('seed').value) || 1;
    log.textContent = '';
    const G = window.LabMiceGenerator;
    const sets = {};
    try {
      for (const key of Object.keys(G.DIFFICULTIES)) {
        log.textContent += `[${G.DIFFICULTIES[key].label}] 만드는 중... (난이도 하나에 수십 초)\n`;
        await new Promise(r => setTimeout(r, 30));
        const t0 = performance.now();
        sets[key] = G.generateDifficulty(key, seed);
        log.textContent += `  → ${sets[key].length}문제 완료 (${((performance.now() - t0) / 1000).toFixed(1)}초)\n`;
      }
    } catch (e) {
      log.textContent += '\n실패: ' + e.message + '\nseed를 바꿔 다시 해 보세요.';
      go.disabled = false;
      return;
    }
    const all = Object.values(sets).flat();
    const text = G.toFileText(sets, seed);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    a.download = 'puzzles.js';
    a.click();
    log.textContent += `\n총 ${all.length}문제. puzzles.js 내려받기 완료!`;
    go.disabled = false;
  };
</script>
</body>
</html>
